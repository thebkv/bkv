<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BKV — Bible Key Version Master Index</title>
  
  <!-- JS-YAML CDN to parse chapters.yaml directly in browser -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #fbbf24;
      --accent-blue: #38bdf8;
      --border-color: #334155;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2rem;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 2.75rem;
      color: var(--accent-gold);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.125rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      color: var(--accent-blue);
      margin: 3rem 0 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .section-summary {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    .subsection-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      color: var(--accent-gold);
      margin: 2rem 0 0.25rem 0;
    }

    .subsection-summary {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.25rem;
      color: var(--text-main);
    }

    .card .subtitle {
      font-size: 0.875rem;
      color: var(--accent-gold);
      margin-bottom: 0.75rem;
      font-style: italic;
    }

    .chapter-list {
      list-style: none;
      font-size: 0.9rem;
    }

    .chapter-list li {
      padding: 0.35rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .chapter-list li:last-child {
      border-bottom: none;
    }

    .chapter-num {
      color: var(--text-muted);
      font-weight: bold;
      min-width: 2rem;
    }

    .chapter-title {
      flex: 1;
      color: var(--text-muted);
    }

    /* Active Link Styling */
    a.active-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    a.active-link:hover {
      color: var(--accent-gold);
      text-decoration: underline;
    }

    .badge-active {
      font-size: 0.7rem;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Bible Key Version</h1>
      <p>The Master Structural Index & Interior Map of Sacred Text</p>
    </header>

    <!-- Dynamic Output Container -->
    <div id="master-index"></div>

    <footer>
      <p>&copy; 2026 Bible Key Version Project — Designed for GitHub Pages</p>
    </footer>
  </div>

  <script>
    async function initMasterIndex() {
      try {
        const response = await fetch('_data/chapters.yaml');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const yamlText = await response.text();
        const data = jsyaml.load(yamlText);
        
        renderIndex(data.sections);
      } catch (error) {
        console.error("Failed to load chapters.yaml:", error);
        document.getElementById('master-index').innerHTML = 
          `<p style="color: var(--accent-gold); text-align: center;">Unable to load chapters.yaml. Ensure file is served locally or hosted on GitHub Pages.</p>`;
      }
    }

    function renderIndex(sections) {
      const container = document.getElementById('master-index');
      container.innerHTML = '';

      sections.forEach(sec => {
        // Section Title & Summary
        const titleEl = document.createElement('h2');
        titleEl.className = 'section-title';
        titleEl.textContent = `Section ${sec.number}: ${sec.name}`;
        container.appendChild(titleEl);

        if (sec.summary) {
          const summaryEl = document.createElement('p');
          summaryEl.className = 'section-summary';
          summaryEl.textContent = sec.summary;
          container.appendChild(summaryEl);
        }

        // Subsections (e.g. Prophets with Major/Minor Prophets)
        if (sec.subsections) {
          sec.subsections.forEach(sub => {
            const subTitleEl = document.createElement('h3');
            subTitleEl.className = 'subsection-title';
            subTitleEl.textContent = sub.name;
            container.appendChild(subTitleEl);

            if (sub.summary) {
              const subSummaryEl = document.createElement('p');
              subSummaryEl.className = 'subsection-summary';
              subSummaryEl.textContent = sub.summary;
              container.appendChild(subSummaryEl);
            }

            container.appendChild(buildBookGrid(sub.books));
          });
        } else if (sec.books) {
          // Standard Sections
          container.appendChild(buildBookGrid(sec.books));
        }
      });
    }

    function buildBookGrid(books) {
      const grid = document.createElement('div');
      grid.className = 'grid';

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = 'card';

        let cardHtml = `<h3>${book.title}</h3>`;
        if (book.subtitle) {
          cardHtml += `<div class="subtitle">${book.subtitle}</div>`;
        }

        cardHtml += `<ul class="chapter-list">`;
        book.chapters.forEach(ch => {
          const formattedNum = String(ch.chapter).padStart(2, '0');
          
          cardHtml += `
            <li>
              <span class="chapter-num">${formattedNum}</span>
              <span class="chapter-title">${ch.bkv_title}</span>
            </li>
          `;
        });
        cardHtml += `</ul>`;

        card.innerHTML = cardHtml;
        grid.appendChild(card);
      });

      return grid;
    }

    document.addEventListener('DOMContentLoaded', initMasterIndex);
  </script>

</body>
</html>
