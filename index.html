<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BKV — Bible Key Version Master Index</title>
  <!-- js-yaml library to parse the YAML file in browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-card: #151e32;
      --bg-card-hover: #1e2942;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-blue: #38bdf8;
      --border-color: #1e293b;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: Georgia, Cambria, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2.5rem;
    }

    header h1 {
      font-family: var(--font-serif);
      font-size: 3rem;
      color: var(--accent-gold);
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    header p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      color: var(--accent-blue);
      margin: 3.5rem 0 1.5rem 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .section-summary {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    .subsection-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--accent-gold);
      margin: 2rem 0 1rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: #334155;
      transform: translateY(-2px);
    }

    .card h3 {
      font-size: 1.35rem;
      margin-bottom: 0.2rem;
      color: var(--text-main);
      font-family: var(--font-sans);
    }

    .card .subtitle {
      font-size: 0.875rem;
      color: var(--accent-gold);
      margin-bottom: 1.25rem;
      font-style: italic;
    }

    .chapter-list {
      list-style: none;
      font-size: 0.925rem;
    }

    .chapter-list li {
      padding: 0.5rem 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .chapter-list li:last-child {
      border-bottom: none;
    }

    .chapter-num {
      color: var(--text-muted);
      font-weight: 700;
      min-width: 1.75rem;
    }

    .chapter-title {
      flex: 1;
      color: var(--text-muted);
    }

    a.chapter-title.active-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }

    a.chapter-title.active-link:hover {
      color: var(--accent-gold);
      text-decoration: underline;
    }

    .badge-active {
      font-size: 0.65rem;
      font-weight: 700;
      background-color: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    footer {
      text-align: center;
      margin-top: 5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    #loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 4rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Bible Key Version</h1>
      <p>The Master Structural Index & Interior Map of Sacred Text</p>
    </header>

    <div id="app">
      <div id="loading">Loading structure from chapters.yaml...</div>
    </div>

    <footer>
      <p>&copy; 2026 Bible Key Version Project — Designed for GitHub Pages</p>
    </footer>
  </div>

  <script>
    async function loadTOC() {
      const app = document.getElementById('app');
      try {
        // Fetch raw chapters.yaml directly from root directory
        const response = await fetch('chapters.yaml');
        if (!response.ok) throw new Error('Failed to load chapters.yaml from the root folder');
        
        const yamlText = await response.text();
        const data = jsyaml.load(yamlText);

        if (!data || !data.sections) {
          throw new Error('YAML parsed but found no sections block.');
        }

        let html = '';

        data.sections.forEach(sec => {
          html += `<h2 class="section-title">Section ${sec.number}: ${sec.name}</h2>`;
          if (sec.summary) {
            html += `<p class="section-summary">${sec.summary}</p>`;
          }

          if (sec.subsections) {
            sec.subsections.forEach(sub => {
              html += `<h3 class="subsection-title">${sub.name}</h3>`;
              if (sub.books) html += renderGrid(sub.books);
            });
          } else if (sec.books) {
            html += renderGrid(sec.books);
          }
        });

        app.innerHTML = html;

      } catch (err) {
        app.innerHTML = `<p style="color: #ef4444; text-align: center; margin: 3rem 0;">Unable to render Table of Contents: ${err.message}</p>`;
      }
    }

    function renderGrid(books) {
      let gridHtml = '<div class="grid">';
      books.forEach(book => {
        gridHtml += `
          <div class="card">
            <h3>${book.title}</h3>
            ${book.subtitle ? `<div class="subtitle">${book.subtitle}</div>` : ''}
            <ul class="chapter-list">
        `;

        if (book.chapters) {
          book.chapters.forEach(ch => {
            const padNum = String(ch.chapter).padStart(2, '0');
            const isActive = ch.status === 'active' || ch.url;

            gridHtml += `<li><span class="chapter-num">${padNum}</span>`;

            if (isActive && ch.url) {
              gridHtml += `<a href="${ch.url}" class="chapter-title active-link">${ch.bkv_title}</a>`;
              gridHtml += `<span class="badge-active">Active</span>`;
            } else {
              gridHtml += `<span class="chapter-title">${ch.bkv_title}</span>`;
            }

            gridHtml += `</li>`;
          });
        }

        gridHtml += `
            </ul>
          </div>
        `;
      });
      gridHtml += '</div>';
      return gridHtml;
    }

    loadTOC();
  </script>
</body>
</html>
